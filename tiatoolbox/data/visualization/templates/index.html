<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/css/ol.css">
  <link rel="stylesheet" href="/css/ol-ext.min.css">
  <link rel="stylesheet" href="/css/fontawesome-all.min.css">
  <link rel="stylesheet" href="/css/visualizer.css">

  <script src="/js/ol.js"></script>
  <script src="/js/polyfill.min.js"></script>
  <script src="/js/ol-ext.min.js"></script>

  <title>{{ title }}</title>
</head>

<body>
  <div class="app-shell">
    <aside class="control-panel">
      <div class="panel-header">
        <p class="eyebrow">TIAToolbox</p>
        <h1>{{ title }}</h1>
        <p class="panel-copy">
          OpenLayers frontend backed by the Flask tileserver.
        </p>
      </div>

      <section class="panel-section">
        <div class="section-heading">
          <h2>Slide</h2>
          <span id="slide-count" class="section-meta"></span>
        </div>
        <label class="field">
          <span>Available slides</span>
          <select id="slide-select"></select>
        </label>
      </section>

      <section class="panel-section">
        <div class="section-heading">
          <h2>Overlays</h2>
          <span id="overlay-count" class="section-meta"></span>
        </div>
        <label class="field">
          <span>Matching overlays</span>
          <select id="overlay-select"></select>
        </label>
        <div class="button-row">
          <button id="add-overlay" type="button">Add Overlay</button>
          <button id="clear-overlays" type="button" class="secondary">Clear</button>
        </div>
        <label class="field compact">
          <span>Raster opacity</span>
          <input id="overlay-opacity" type="range" min="0" max="1" step="0.05" value="0.7">
        </label>
      </section>

      <section id="annotation-section" class="panel-section is-disabled">
        <div class="section-heading">
          <h2>Annotations</h2>
          <span id="annotation-path" class="section-meta">No vector overlay</span>
        </div>
        <label class="field">
          <span>Color by</span>
          <select id="color-property"></select>
        </label>
        <label class="field">
          <span>Filter expression</span>
          <textarea id="filter-expression" rows="3" placeholder="Example: props['score'] > 0.5"></textarea>
        </label>
        <div class="button-row">
          <button id="apply-filter" type="button">Apply Filter</button>
          <button id="reset-filter" type="button" class="secondary">Reset</button>
        </div>
        <label class="field compact">
          <span>Annotation opacity</span>
          <input id="annotation-opacity" type="range" min="0" max="1" step="0.05" value="0.8">
        </label>
        <div id="legend" class="legend empty">Load a SQLiteStore-backed overlay to enable vector styling.</div>
      </section>

      <section class="panel-section">
        <div class="section-heading">
          <h2>Slide Info</h2>
        </div>
        <dl id="slide-info" class="info-grid"></dl>
      </section>

      <section class="panel-section">
        <div class="section-heading">
          <h2>Selection</h2>
        </div>
        <div id="feature-details" class="feature-details empty">
          Click an annotation feature to inspect its properties.
        </div>
      </section>

      <footer class="panel-footer">
        <span id="status-text">Preparing viewer…</span>
      </footer>
    </aside>

    <main class="viewer-shell">
      <div id="empty-state" class="empty-state">Loading viewer…</div>
      <div id="map" class="map"></div>
    </main>
  </div>

  <script id="viewer-config" type="application/json">{{ frontend_config | safe }}</script>
  <script src="/js/visualizer.js"></script>
</body>

</html>
