{% extends base %}

<!-- goes in head -->
{% block preamble %}
<link href="bokeh_app/static/custom.min.css" rel="stylesheet">
{% endblock %}

{% block postamble %}
  <style>
    .slide {
        width: 80%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        margin: 10px 0;
    }
    .ui {
        width: 20%;
        height: 100%;
        position: absolute;
        top: 0;
        right: 0;
    }
    .description {
        width: 78%;
        height: 100%;
        position: absolute;
        top: 100%;
        left: 2%;
        margin: 10px 0;
    }
    .assistant-panel {
      gap: 10px;
      padding: 6px 2px;
    }

    .assistant-transcript {
      height: 360px;
      overflow-y: auto;
      background: #f8fafc;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 8px;
    }

    .assistant-empty {
      color: #6b7280;
      font-style: italic;
    }

    .assistant-msg {
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      white-space: normal;
      line-height: 1.35;
    }

    .assistant-role {
      font-weight: 600;
      margin-bottom: 3px;
      font-size: 12px;
      opacity: 0.9;
    }

    .assistant-user-msg {
      background: #e7f0ff;
      border: 1px solid #c7dbff;
    }

    .assistant-bot-msg {
      background: #edfdf3;
      border: 1px solid #bce9cc;
    }

    .assistant-system-msg {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
    }

    .assistant-status {
      color: #374151;
      font-size: 12px;
      padding: 2px 0;
      min-height: 18px;
    }

    .hidden {
      display: none;
    }

    .popup {
      position: absolute;
      top: 30%;
      left: 20%;
      width: 20%;
      height: 30%;
      background-color: rgba(0, 0, 0, 0.0);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .popup-content {
      background-color: white;
      padding: 10px;
      border-radius: 5px;
      width: 80%;
      max-width: 350px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      z-index: 2;
    }
    .popup-body {
      height: 75%;
      overflow: auto;
    }

    .popup-header {
      cursor: move;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

  </style>
{% endblock %}

<!-- goes in body -->
{% block contents %}
<div id="popup" class="popup">
  <div class="popup-content hidden">
    <div class="popup-header">
      <h2>Annotation Properties</h2>
    </div>
    <div class="popup-body">
    {{ embed(roots.popup_window) }}
    </div>
    <button class="btn btn-primary" id="close-popup">Close</button>
  </div>
</div>
<div class="slide"> {{ embed(roots.slide_windows) }} </div><div class="ui"> {{ embed(roots.ui_layout) }} </div>
<div class="description"> {{ embed(roots.description) }} </div>
<script>
  const closePopupBtn = document.getElementById('close-popup');
  const popup = document.getElementById('popup');
  const popupContent = document.querySelector('.popup-content');
  const popupHeader = document.querySelector('.popup-header');

  let isDragging = false;
  let offsetX, offsetY;

  closePopupBtn.addEventListener('click', function() {
      popupContent.classList.add('hidden');
  });

  popupHeader.addEventListener('mousedown', function(e) {
      isDragging = true;
      offsetX = e.clientX - popupContent.getBoundingClientRect().left;
      offsetY = e.clientY - popupContent.getBoundingClientRect().top;
  });

  document.addEventListener('mousemove', function(e) {
      if (isDragging) {
          popupContent.style.left = (e.clientX - offsetX) + 'px';
          popupContent.style.top = (e.clientY - offsetY) + 'px';
          popupContent.style.position = 'fixed';
          console.log('New position is:', popupContent.style.left, popupContent.style.top);
      }
  });

  document.addEventListener('mouseup', function() {
      isDragging = false;
  });
</script>
{% endblock %}
